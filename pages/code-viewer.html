<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código Arduino - Laboratorio de Física</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/code-viewer.css" />
  </head>
  <body>
    <div id="ambient-particles" aria-hidden="true"></div>
    <div class="page-shell">
      <div class="page-header">
        <h1>Visualizador de Código Arduino</h1>
        <div class="actions">
          <button
            class="btn-primary"
            onclick="window.location.href = '../index.html'"
          >
            Inicio
          </button>
          <button
            class="btn-secondary"
            onclick="window.location.href = 'simulator.html'"
          >
            Simulador
          </button>
          <button id="copy-code" class="btn-copy" type="button">Copiar</button>
        </div>
      </div>

      <div class="code-panel">
        <div class="code-header">
          <span>firmware/main.ino</span>
        </div>
        <pre id="code-output">Cargando código...</pre>
      </div>
      <div id="status" class="status">Solicitando archivo...</div>
    </div>

    <script src="../assets/js/particles.js"></script>
    <script src="../assets/js/code-viewer.js"></script>
  </body>
</html>
